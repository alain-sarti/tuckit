name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Covers gofmt, go vet, errcheck, staticcheck, ineffassign and unused.
      # Config lives in .golangci.yml. Keep the version in sync with AGENTS.md.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # '1.23' is the minimum declared in go.mod; keep in sync if that bumps.
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
